{% extends "base.html" %}

{% block content %}
<header class="page-header">
  <div>
    <h1>LOS Heatmap</h1>
    <p class="lede">
      Visibility density from sampled deployment positions. Red cells are low
      visibility; green cells are visible from more samples.
    </p>
  </div>
</header>

<section class="panel">
  <form class="toolbar" method="get" action="/heatmap">
    <label>
      Map packet
      <select name="packet_id">
        {% for option in packets %}
        <option value="{{ option.id }}" {{ "selected" if option.id == packet.id else "" }}>{{ option.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Deployment zone
      <select name="zone_id">
        {% for zone in packet.deployment_zones %}
        <option value="{{ zone.id }}" {{ "selected" if zone.id == selected_zone_id else "" }}>{{ zone.label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Sample source
      <select name="source">
        <option value="edge" {{ "selected" if selected_source == "edge" else "" }}>
          Deployment edge
        </option>
        <option value="interior" {{ "selected" if selected_source == "interior" else "" }}>
          Full deployment zone
        </option>
      </select>
    </label>
    <label class="range-label">
      Edge offset
      <span class="range-value">{{ selected_offset_inches }} in</span>
      <input
        name="offset_inches"
        type="range"
        min="0"
        max="12"
        step="1"
        value="{{ selected_offset_inches }}"
        list="offset-markers"
        {{ "disabled" if selected_source == "interior" else "" }}
      >
      <datalist id="offset-markers">
        {% for value in offset_options %}
        <option value="{{ value }}"></option>
        {% endfor %}
      </datalist>
    </label>
    <button type="submit">Generate</button>
  </form>
  <div class="heatmap-legend" aria-label="Heatmap color legend">
    <span><i class="legend-swatch heat-low"></i>Low</span>
    <span><i class="legend-swatch heat-mid-low"></i>Limited</span>
    <span><i class="legend-swatch heat-mid"></i>Contested</span>
    <span><i class="legend-swatch heat-mid-high"></i>Good</span>
    <span><i class="legend-swatch heat-high"></i>High</span>
    <span><i class="legend-line safe-line"></i>Fully obscured</span>
  </div>
  <div class="map-wrap">{{ map_svg | safe }}</div>
</section>
{% endblock %}
