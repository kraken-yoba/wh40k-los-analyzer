[project]
name = "fortyk-los-analyzer"
version = "0.1.0"
description = "Local deterministic Warhammer 40k LOS analysis tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "httpx2>=2.4.0",
  "jinja2>=3.1.0",
  "opencv-python-headless>=4.10.0.84",
  "pydantic>=2.8.0",
  "pymupdf>=1.24.0",
  "shapely>=2.0.0",
  "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-playwright>=0.5.0",
  "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"

[[tool.mypy.overrides]]
module = ["shapely.*"]
ignore_missing_imports = true
