[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warhammer-tournament-companion"
version = "0.1.0"
description = "Python-only Warhammer 40,000 terrain and line-of-sight analysis MVP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "jinja2>=3.1.0",
  "numpy>=2.0.0",
  "opencv-python-headless>=4.10.0",
  "openai-codex>=0.1.0b3",
  "pillow>=10.4.0",
  "pydantic>=2.8.0",
  "pymupdf>=1.24.0",
  "python-multipart>=0.0.9",
  "requests>=2.32.0",
  "shapely>=2.0.0",
  "typer>=0.12.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.11.0",
  "pytest>=8.3.0,<9",
  "ruff>=0.6.0",
  "types-shapely>=2.0.0"
]

[project.scripts]
warhammer-companion = "warhammer_companion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warhammer_companion = [
  "py.typed",
  "catalog_assets/*.svg",
  "web/templates/*.html",
  "web/static/*.css"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["warhammer_companion"]
