name: Build windows app

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  build-windows-app:
    name: Build windows app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,desktop,package]"

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: mypy src

      - name: Test
        run: python -m pytest

      - name: Validate official packets
        run: python -m warhammer_companion.cli validate-packets

      - name: Build PyInstaller app
        run: pyinstaller --noconfirm packaging/pyinstaller/WarhammerTournamentCompanion.spec

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath .\dist\WarhammerTournamentCompanion\WarhammerTournamentCompanion.exe `
            -ArgumentList "--smoke-test" `
            -Wait `
            -PassThru
          exit $process.ExitCode

      - name: Build portable zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = Resolve-Path .\dist
          $destination = Join-Path $zipPath "WarhammerTournamentCompanion-portable.zip"
          if (Test-Path $destination) {
            Remove-Item $destination
          }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path .\dist\WarhammerTournamentCompanion),
            $destination
          )

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            .\packaging\windows\WarhammerTournamentCompanion.iss

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: WarhammerTournamentCompanion-portable
          path: dist/WarhammerTournamentCompanion-portable.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WarhammerTournamentCompanion-installer
          path: dist/installer/WarhammerTournamentCompanionSetup.exe
